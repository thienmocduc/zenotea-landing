<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal thương mại — Zen O Tea</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E211A">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Charmonman:wght@400;700&family=Noto+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../portal.css">
</head>
<body>

<aside class="canh" id="canh">
  <div class="canh-dau">
    <a href="../"><img src="../logo.png" alt="Zen O Tea"></a>
  </div>
  <nav class="canh-nav" id="canh-nav" aria-label="Điều hướng portal"></nav>
</aside>
<div class="che" id="che"></div>

<div class="than">
  <header class="top">
    <button class="nut-menu" id="nut-menu" aria-label="Mở menu">☰</button>
    <h1 id="tieu-man">Bảng điều khiển</h1>
    <div class="phai">
      <select class="chon-vai" id="chon-vai" aria-label="Vai trò"></select>

      <div class="tk">
        <button class="tk-nut" id="tk-nut" aria-haspopup="true" aria-expanded="false"
                aria-label="Tài khoản">
          <span class="avt" id="avt">TĐ</span>
        </button>
        <div class="tk-menu" id="tk-menu" role="menu">
          <div class="tk-dau">
            <b id="tk-ten">Trần Minh Đức</b>
            <span id="tk-vai">Thành viên tiêu dùng</span>
          </div>
          <button class="tk-muc" data-mo="cai-hoso"  role="menuitem">Hồ sơ &amp; ảnh đại diện</button>
          <button class="tk-muc" data-mo="cai-xacminh" role="menuitem">Xác minh chính chủ
            <span class="canh-bao" id="bao-xacminh">chưa xong</span></button>
          <button class="tk-muc" data-mo="cai-bank"  role="menuitem">Tài khoản ngân hàng
            <span class="canh-bao" id="bao-bank">chưa có</span></button>
          <button class="tk-muc" data-mo="cai-thue"  role="menuitem">Mã số thuế</button>
          <button class="tk-muc" data-mo="cai-baomat" role="menuitem">Bảo mật</button>
          <button class="tk-muc" id="thoat" role="menuitem">Đăng xuất</button>
        </div>
      </div>
    </div>
  </header>
  <main class="noi" id="noi"></main>
</div>

<script>
  window.KHOI = { duLieu: '../data/portal/', coBang: false, api: '/api/v1' };
</script>
<script src="../portal-shell.js"></script>

</body>
</html>
